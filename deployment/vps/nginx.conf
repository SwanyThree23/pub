# ─────────────────────────────────────────────────────────────
# Nginx Config – Unified Platform
# VPS: srv1587098.hstgr.cloud  |  2.24.198.112
# ─────────────────────────────────────────────────────────────

# Rate limiting zones
limit_req_zone  $binary_remote_addr zone=api:10m   rate=60r/m;
limit_req_zone  $binary_remote_addr zone=auth:10m  rate=10r/m;
limit_conn_zone $binary_remote_addr zone=addr:10m;

# ── Frontend – srv1587098.hstgr.cloud ────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name srv1587098.hstgr.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name srv1587098.hstgr.cloud;

    ssl_certificate     /etc/letsencrypt/live/srv1587098.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srv1587098.hstgr.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    # Next.js static files
    location /_next/static/ {
        alias /opt/unified-platform/frontend/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ── Backend API – api.srv1587098.hstgr.cloud ─────────────────
server {
    listen 80;
    server_name api.srv1587098.hstgr.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.srv1587098.hstgr.cloud;

    ssl_certificate     /etc/letsencrypt/live/api.srv1587098.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.srv1587098.hstgr.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # REST API
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_conn addr 20;

        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Rate-limit auth routes more strictly
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Webhooks – no rate limit
    location /api/webhooks/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_set_header   Host $host;
        proxy_read_timeout 30s;
    }

    # Socket.io WebSocket
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health check (no rate limit)
    location /health {
        proxy_pass http://127.0.0.1:4000;
    }
}
